name: GitHub Classroom Workflow
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v2

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Unit tests flight-service
        run: cd flight-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests ticket-service
        run: cd ticket-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests bonus-service
        run: cd bonus-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Unit tests gateway-service
        run: cd gateway-service && chmod +x gradlew && ./gradlew test --no-daemon

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: |
          docker compose up -d
          ./scripts/wait-script.sh
        env:
          WAIT_PORTS: 8080,8070,8060,8050

      - name: Run API Tests
        timeout-minutes: 5
        run: ./scripts/test-script.sh
        env:
          VARIANT: v1
          SERVICE_NAME: bonus-service
          PORT_NUMBER: 8050

      - name: Stop containers
        if: always()
        continue-on-error: true
        run: docker compose down -v