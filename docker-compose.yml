version: "3"
services:
  postgres:
    image: library/postgres:13
    container_name: postgres
    restart: on-failure
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./postgres/:/docker-entrypoint-initdb.d/
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 10

  bonus-service:
    build: ./bonus-service
    container_name: bonus-service
    restart: on-failure
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy

  flight-service:
    build: ./flight-service
    container_name: flight-service
    restart: on-failure
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy

  ticket-service:
    build: ./ticket-service
    container_name: ticket-service
    restart: on-failure
    ports:
      - "8070:8070"
    depends_on:
      postgres:
        condition: service_healthy

  gateway-service:
    build: ./gateway-service
    container_name: gateway-service
    restart: on-failure
    ports:
      - "8080:8080"
    depends_on:
      - flight-service
      - ticket-service
      - bonus-service
    environment:
      FLIGHT_SERVICE_URL: http://flight-service:8060
      TICKET_SERVICE_URL: http://ticket-service:8070
      BONUS_SERVICE_URL: http://bonus-service:8050

volumes:
  db-data: